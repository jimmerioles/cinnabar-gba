[workspace]
resolver = "3"
members = [
    "crates/cinnabar-core",
    "crates/cinnabar-frontend",
    "crates/cinnabar-testrom",
    "crates/cinnabar-wasm",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["The Cinnabar Authors"]
repository = "https://github.com/jimmerioles/cinnabar-gba"

[workspace.dependencies]
cinnabar-core = { path = "crates/cinnabar-core" }
cinnabar-testrom = { path = "crates/cinnabar-testrom" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
rtrb = "0.3"
softbuffer = "0.4"
winit = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
