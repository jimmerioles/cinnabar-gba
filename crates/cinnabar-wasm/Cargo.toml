[package]
name = "cinnabar-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cinnabar GBA: experimental browser frontend"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cinnabar-core.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "Window",
] }
