# Cinnabar GBA configuration.
#
# Default location:
#   $XDG_CONFIG_HOME/cinnabar/config.toml
#   ~/.config/cinnabar/config.toml
#
# Pass --config path/to/config.toml to use another file.

scale = 4
# Combine effects with commas: lcd, ghosting, color.
shader = "none"
volume = 1.0

# Keyboard layout preset (change this value to switch):
#   ergonomic (default) - ESDF D-pad, J/K face, A/L shoulders
#   classic             - arrow D-pad, Z/X face, A/S shoulders
#   numpad              - arrow D-pad, numpad face/shoulders/Start/Select
keyboard_layout = "ergonomic"

# Optional default directory for --library.
# library = "/home/you/Games/gba"

# Per-button overrides applied on top of the selected preset.
# Each button accepts one or more comma-separated keys.
#
# Key names include single letters/digits ("a", "1"), "enter", "space",
# "backspace", "tab", arrow names ("up", "down", "left", "right"), function
# keys ("f1".."f12"), "shift"/"lshift"/"rshift", "ctrl", "alt", punctuation
# names ("comma", "semicolon", "slash", "minus", ...), and numpad keys
# ("numpad0".."numpad9", "numpadenter", "numpadadd", "numpadsubtract",
# "numpadmultiply", "numpaddivide", "numpaddecimal"). "kp0".."kp9" and
# "kpenter" work as short aliases. Each key can only trigger one button;
# conflicting bindings are rejected.
[keys]
# Ergonomic defaults:
# Up = "e"
# Down = "d"
# Left = "s"
# Right = "f"
# B = "j"
# A = "k"
# L = "a"
# R = "l"
# Start = "enter"
# Select = "backspace"

# Example: a WASD variant on top of the ergonomic preset. Uncomment the
# whole block to keep WASD and move the shoulders off the movement keys.
# Up = "w"
# Down = "s"
# Left = "a"
# Right = "d"
# L = "lshift"
# R = "o"

# Example: replace one button with multiple keys.
# A = "space, g"
