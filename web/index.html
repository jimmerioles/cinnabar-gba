<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinnabar GBA — browser preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b14;
        color: #dbe4ff;
      }
      main {
        width: min(92vw, 760px);
        text-align: center;
      }
      canvas {
        width: 100%;
        max-width: 720px;
        aspect-ratio: 3 / 2;
        image-rendering: pixelated;
        border: 1px solid #26324a;
        border-radius: 8px;
        background: #000;
      }
      input {
        margin: 1rem 0;
      }
      p {
        color: #8b97b3;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      code {
        color: #ff8a65;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cinnabar GBA</h1>
      <p>Experimental browser preview. Load a legally dumped <code>.gba</code> ROM.</p>
      <input id="rom" type="file" accept=".gba,application/octet-stream" />
      <canvas id="screen" width="240" height="160"></canvas>
      <p>
        Controls: arrows = D-pad, A/Z = A, S/X = B, Enter = Start,
        Backspace = Select, Q/E = L/R. Video only; audio is not wired up yet.
      </p>
    </main>

    <script type="module">
      import init, { Emulator } from "./pkg/cinnabar_wasm.js";

      await init();

      const canvas = document.getElementById("screen");
      const input = document.getElementById("rom");
      let emulator = null;
      let keys = 0;
      let running = false;

      const keyMap = {
        KeyA: 1 << 0,
        KeyZ: 1 << 0,
        KeyS: 1 << 1,
        KeyX: 1 << 1,
        Backspace: 1 << 2,
        Enter: 1 << 3,
        ArrowRight: 1 << 4,
        ArrowLeft: 1 << 5,
        ArrowUp: 1 << 6,
        ArrowDown: 1 << 7,
        KeyE: 1 << 8,
        KeyQ: 1 << 9,
      };

      input.addEventListener("change", async () => {
        const file = input.files?.[0];
        if (!file) return;
        const rom = new Uint8Array(await file.arrayBuffer());
        emulator = new Emulator(rom, canvas.id);
        emulator.set_keys(0);
        running = true;
        requestAnimationFrame(loop);
      });

      addEventListener("keydown", (event) => {
        const bit = keyMap[event.code];
        if (bit) {
          keys |= bit;
          emulator?.set_keys(keys);
          event.preventDefault();
        }
      });

      addEventListener("keyup", (event) => {
        const bit = keyMap[event.code];
        if (bit) {
          keys &= ~bit;
          emulator?.set_keys(keys);
          event.preventDefault();
        }
      });

      function loop() {
        if (!running || !emulator) return;
        emulator.run_frame();
        // The core runs at 59.73 Hz, close enough to a 60 Hz display. A
        // production frontend would pace against AudioContext.currentTime.
        setTimeout(() => requestAnimationFrame(loop), 1000 / 60);
      }
    </script>
  </body>
</html>
